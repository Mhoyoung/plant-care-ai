<div id="garden-navigation" class="garden-navigation">
  <button type="button" class="garden-menu-button" aria-label="정원 메뉴 열기" aria-controls="garden-sidebar" hidden>
    <span class="garden-menu-icon" aria-hidden="true"></span>
    <span>메뉴</span>
  </button>
  <div class="mobile-brand">🌿 내 식물 기록 <span>작은 관찰, 함께 자라는 하루</span></div>
</div>
<button type="button" class="garden-back-to-top" aria-label="맨 위로" title="맨 위로" hidden>
  <span aria-hidden="true">↑</span>
</button>
<script>
(() => {
  // Only this checked-in, static HTML enables JavaScript; no user data is inserted.
  const app = document.querySelector('.stApp');
  const header = document.getElementById('garden-navigation');
  const scroller = app?.querySelector('[data-testid="stMain"]');
  const topButton = app?.querySelector('.garden-back-to-top');
  if (!app || !header || !scroller || !topButton) return;
  window.gardenNavigationCleanup?.();
  const button = header.querySelector('button');
  let expanded = false;
  let returnFocus = false;
  const updateTopButton = () => {
    topButton.hidden = expanded || scroller.scrollTop < Math.max(320, scroller.clientHeight * .6);
  };
  const cleanup = () => {
    observer.disconnect();
    scroller.removeEventListener('scroll', updateTopButton);
    window.removeEventListener('resize', updateTopButton);
    button.removeEventListener('click', openMenu);
    topButton.removeEventListener('click', returnToTop);
    app.classList.remove('garden-menu-ready');
  };
  const sync = () => {
    if (!header.isConnected) { cleanup(); return; }
    const opener = app.querySelector('[data-testid="stExpandSidebarButton"]');
    const sidebar = app.querySelector('[data-testid="stSidebar"]');
    if (sidebar) sidebar.id = 'garden-sidebar';
    const isExpanded = sidebar?.getAttribute('aria-expanded') === 'true';
    const closer = app.querySelector('[data-testid="stSidebarCollapseButton"] button');
    closer?.setAttribute('aria-label', '정원 메뉴 닫기');
    const menuHadFocus = document.activeElement === button;
    button.hidden = !opener;
    app.classList.toggle('garden-menu-ready', Boolean(opener));
    if (isExpanded && !expanded && menuHadFocus) {
      app.querySelector('[data-testid="stSidebarCollapseButton"] button')?.focus();
    } else if (!isExpanded && expanded && returnFocus &&
        (document.activeElement === document.body ||
         app.querySelector('[data-testid="stSidebarCollapseButton"]')?.contains(document.activeElement))) {
      button.focus();
      returnFocus = false;
    }
    expanded = isExpanded;
    updateTopButton();
  };
  const openMenu = () => {
    const opener = app.querySelector('[data-testid="stExpandSidebarButton"]');
    if (opener) { returnFocus = true; opener.click(); }
  };
  const returnToTop = () => {
    // Focus the destination without an abrupt jump; honor reduced-motion settings.
    button.focus({ preventScroll: true });
    scroller.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
  };
  button.addEventListener('click', openMenu);
  topButton.addEventListener('click', returnToTop);
  scroller.addEventListener('scroll', updateTopButton, { passive: true });
  window.addEventListener('resize', updateTopButton);
  // Leave Streamlit's own button and sidebar under React's ownership.
  const observer = new MutationObserver(sync);
  observer.observe(app, { childList: true, subtree: true });
  window.gardenNavigationCleanup = cleanup;
  sync();
})();
</script>
